<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Test your knowledge of private jet makes, models, and engines.">
    <title>Private Jet Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="setup-view" class="setup-view">
            <div class="setup-card">
                <p class="eyebrow">Aircraft recognition</p>
                <h1>Private Jet Quiz</h1>
                <p class="intro">Identify business jets by make, model, or engine.</p>

                <form id="quiz-form">
                    <label for="quiz-mode">Quiz me on</label>
                    <select id="quiz-mode" name="quiz-mode">
                        <option value="make">Manufacturer</option>
                        <option value="model">Aircraft model</option>
                        <option value="engine">Engine</option>
                        <option value="all">A random mix</option>
                    </select>

                    <label for="question-count">Number of questions</label>
                    <div class="number-row">
                        <input id="question-count" name="question-count" type="number" min="1" max="8" value="8">
                        <span>Maximum: 8</span>
                    </div>

                    <button class="primary-button" type="submit">Start Quiz</button>
                </form>
            </div>
        </section>

        <section id="quiz-view" class="quiz-view hidden" aria-labelledby="question-prompt">
            <header class="quiz-header">
                <div>
                    <p class="eyebrow">Private Jet Quiz</p>
                    <p id="progress">Question 1 of 8</p>
                </div>
                <button id="exit-button" class="text-button" type="button">Exit quiz</button>
            </header>

            <div class="quiz-card">
                <div class="image-frame">
                    <img id="jet-image" alt="Private jet to identify">
                    <p id="image-status">Loading aircraft...</p>
                </div>

                <p id="score">Score: 0</p>
                <h1 id="question-prompt">Who makes this aircraft?</h1>
                <div id="choices" class="choices"></div>
                <p id="feedback" class="feedback" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
